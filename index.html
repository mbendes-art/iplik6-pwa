<!DOCTYPE html>

            </div>
            
            <!-- Arama Kutusu -->

            <!-- Hızlı Kategori Filtre Butonları -->
            <div id="category-pills" class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="setCategoryFilter('RING_BOBIN', 'machine_ringbobin')" class="cat-btn bg-sky-600 text-white px-3 py-2 rounded-lg font-medium transition text-center">Ring/Bobin</button>
                <button onclick="setCategoryFilter('IHZARAT', 'machine_ihzarat')" class="cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center">İhzarat</button>
                <button onclick="setCategoryFilter('PAKETLEME_FIKSE', 'paketleme_fikse_grup')" class="cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center">Paketleme/Fikse</button>

            </div>

            <div id="machine-list" class="space-y-3 pb-6">

            </div>

        <!-- Machine Detail & Records Section -->

    <!-- Giriş Logları Modal -->

            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-indigo-400">📋 Sistem Giriş Raporu</h3>
                <button onclick="closeLogsModal()" class="text-slate-400 hover:text-white text-sm font-bold px-2 py-1 bg-slate-700 rounded">✕</button>
            </div>

    <!-- Kayıt Ekle Modal (Tekil) -->

                    <option value="Arıza Bildirimi" selected>Arıza Bildirimi</option>
                    <option value="Mekanik Müdahale">Mekanik Müdahale</option>

            <input type="hidden" id="edit-rec-id">

                <select id="edit-rec-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Periyodik Bakım">Periyodik Bakım</option>
                    <option value="Arıza Bildirimi">Arıza Bildirimi</option>
                    <option value="Mekanik Müdahale">Mekanik Müdahale</option>
                    <option value="Arıza Onarımı">Arıza Onarımı</option>
                </select>

            <div>
                <label for="edit-rec-date" class="block text-xs text-slate-400 mb-1">Kayıt Tarihi ve Saati</label>
                <input type="datetime-local" id="edit-rec-date" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Açıklama</label>
                <textarea id="edit-rec-desc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Değişen Parçalar / Not</label>
                <input type="text" id="edit-rec-parts" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeEditRecordModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm transition">İptal</button>
                <button onclick="submitEditRecord()" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2.5 rounded-lg text-sm font-semibold transition">Güncelle</button>
            </div>
        </div>
    </div>

    <!-- Toplu Kayıt Ekle Modal -->
    <div id="bulk-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-sky-400">⚡ Seçilen Makinelere Toplu Kayıt</h3>
            <p id="bulk-modal-info" class="text-xs text-slate-400"></p>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Kayıt Türü</label>
                <select id="bulk-rec-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Periyodik Bakım">Periyodik Bakım</option>
                    <option value="Arıza Bildirimi" selected>Arıza Bildirimi</option>
                    <option value="Mekanik Müdahale">Mekanik Müdahale</option>
                    <option value="Arıza Onarımı">Arıza Onarımı</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Ortak Açıklama</label>
                <textarea id="bulk-rec-desc" rows="3" placeholder="Tüm seçili makineler için ortak açıklamayı yazın..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500"></textarea>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Değişen Parçalar / Not</label>
                <input type="text" id="bulk-rec-parts" placeholder="Örn: Filtre değişti (Yoksa boş bırakın)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">

            <div class="flex gap-2 pt-2">
                <button onclick="closeBulkModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm transition">İptal</button>
                <button onclick="submitBulkRecords()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg text-sm font-semibold transition">Toplu Kaydet</button>

        </div>
    </div>

            { username: "a_aslan", name: "A. Aslan", role: "RING_BOBIN" },

        const FIKSE_KAZANI_USERS = ["m_altuntas", "r_sahin", "n_erturk", "g_albayrak"];

        let currentUser = null;
        let allMachinesCache = [];

        let currentCategoryFilter = 'RING_BOBIN';

        // 🛡️ KESİN GEÇMİŞ KİLİDİ
        history.replaceState({ page: 'app' }, document.title, window.location.href);
        window.addEventListener('popstate', function (event) {
            history.pushState({ page: 'app' }, document.title, window.location.href);
            if (currentUser) {
                const detailSec = document.getElementById('detail-section');
                const recordModal = document.getElementById('record-modal');
                const editModal = document.getElementById('edit-record-modal');
                const logsModal = document.getElementById('logs-modal');
                const bulkModal = document.getElementById('bulk-modal');

                if (!recordModal.classList.contains('hidden')) {
                    closeAddRecordModal();
                } else if (!editModal.classList.contains('hidden')) {
                    closeEditRecordModal();
                } else if (!logsModal.classList.contains('hidden')) {
                    closeLogsModal();
                } else if (!bulkModal.classList.contains('hidden')) {
                    closeBulkModal();
                } else if (!detailSec.classList.contains('hidden')) {
                    backToDashboard();
                }
            }
        });

        // 💾 Oturum Yönetimi
        window.addEventListener('DOMContentLoaded', () => {
            const savedUserJson = localStorage.getItem('iplik6_current_user');
            if (savedUserJson) {
                try {
                    currentUser = JSON.parse(savedUserJson);
                    document.getElementById('user-info').innerText = currentUser.name;
                    document.getElementById('role-badge').innerText = `Rol: ${currentUser.role}`;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');

                    if (currentUser.username === 'mbendes') {
                        document.getElementById('view-logs-btn').classList.remove('hidden');
                    }

                    setupCategoryPills();
                    loadMachines();
                } catch(e) {
                    localStorage.removeItem('iplik6_current_user');
                }
            }
        });

        function normalize(str) {
            return (str || "")
                .toString()
                .trim()
                .replace(/\u0307/g, '')
                .replace(/İ/g, 'i')
                .replace(/I/g, 'i')
                .replace(/ı/g, 'i')
                .replace(/Ğ/g, 'g')
                .replace(/ğ/g, 'g')
                .replace(/Ü/g, 'u')
                .replace(/ü/g, 'u')
                .replace(/Ş/g, 's')
                .replace(/ş/g, 's')
                .replace(/Ö/g, 'o')
                .replace(/ö/g, 'o')
                .replace(/Ç/g, 'c')
                .replace(/ç/g, 'c')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase();
        }

        function compactKey(str) {
            return normalize(str).replace(/[\s\-_/.]+/g, '');
        }

        function isFikseMachine(machine) {
            const txt = normalize(`${machine.machine_name || machine.name || ''} ${machine.code || ''} ${machine.machine_no || ''} ${machine.location || ''}`);
            return txt.includes('fikse') || txt.includes('kazan');
        }

        function isPaketMachine(machine) {
            const c = normalize(machine.code || '');
            const n = normalize(machine.name || machine.machine_name || '');
            return c.includes('paket') || n.includes('paket') || c.includes('pak') || n.includes('pak');
        }

        async function handleLogin() {
            const rawInput = document.getElementById('username-input').value.trim();
            const normInput = normalize(rawInput);
            
            if(!normInput) {
                alert('Lütfen bir kullanıcı adı girin!');
                return;
            }

            const foundUser = USERS.find(u => normalize(u.username) === normInput);
            if(!foundUser) {
                alert('Hatalı veya tanımlı olmayan kullanıcı adı!');
                return;
            }

            currentUser = foundUser;
            localStorage.setItem('iplik6_current_user', JSON.stringify(currentUser));
            
            try {
                await supabaseClient.from('login_logs').insert([{ 
                    username: currentUser.username, 
                    login_time: new Date().toLocaleString('tr-TR') 
                }]);
            } catch(e) {}

            document.getElementById('user-info').innerText = currentUser.name;
            document.getElementById('role-badge').innerText = `Rol: ${currentUser.role}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');

            if (currentUser.username === 'mbendes') {
                document.getElementById('view-logs-btn').classList.remove('hidden');
            } else {
                document.getElementById('view-logs-btn').classList.add('hidden');
            }

            setupCategoryPills();
            loadMachines();
        }

                name: "İşletme Operatörü",
                role: "OPERATOR"
            };
            localStorage.setItem('iplik6_current_user', JSON.stringify(currentUser));

            document.getElementById('user-info').innerText = currentUser.name;
            document.getElementById('role-badge').innerText = `Rol: Operatör`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');

            await setCategoryFilter('TUM_ARIZALAR', 'tum_arizalar');
        }

                selectedMachine = null;
                allMachinesCache = [];
                currentCategoryFilter = 'RING_BOBIN';

                    .filter(m => isPaketMachine(m) && !isFikseMachine(m))
                    .map(m => ({ ...m, _sourceTable: 'machines', _brand: m.brand || 'Paketleme', _isFikse: false }));

                    .filter(m => isFikseMachine(m))
                    .map(m => ({ ...m, _sourceTable: 'machines', _brand: m.brand || 'Fikse Kazan', _isFikse: true }));

                if (fikseList.length === 0) {
                    fikseList.push({
                        id: 9981,
                        machine_name: 'FİKSE KAZANI',
                        name: 'FİKSE KAZANI',
                        code: 'FİKSE KAZANI',
                        location: 'İplik-6',
                        brand: 'Fikse Kazan',
                        _sourceTable: 'machines',
                        _brand: 'Fikse Kazan',
                        _isFikse: true
                    });

                allMachinesCache = [...paketlemeList, ...fikseList];
            } else if (activeTableName === 'klima_kompresor_grup') {
                const [compRes, dryRes, mainRes] = await Promise.all([

                    k._sourceTable = 'machines';

        function sortMachinesCustom(a, b) {
            return a.id - b.id;
        }

        function getIhzaratNormalizedText(m) {
            const name = normalize(m.machine_name || m.name || '');
            const opNo = normalize(String(m.operation_no || ''));
            const mNo = normalize(String(m.machine_no || ''));
            const code = normalize(String(m.code || ''));
            const brand = normalize(String(m.brand || ''));
            const model = normalize(String(m.model || ''));
            const combined = `${name}-${opNo}`.trim();
            return { name, opNo, mNo, code, brand, model, combined };
        }

        function resolveTargetCategoryForSearch(searchVal) {
            const compact = compactKey(searchVal);

            // Ring ve Bobin Aramaları (K46 dahil)
            if (
                searchVal.startsWith('ring') ||
                searchVal.startsWith('bobin') ||
                searchVal.startsWith('k46') ||
                searchVal.startsWith('qpro') ||
                compact.startsWith('ring') ||
                compact.startsWith('bobin') ||
                compact.startsWith('k46')
            ) {
                return { cat: 'RING_BOBIN', table: 'machine_ringbobin' };
            }

            if (
                searchVal.startsWith('fikse') ||
                searchVal.startsWith('kazan') ||
                searchVal.startsWith('paket') ||
                searchVal.startsWith('pak') ||
                compact.startsWith('fikse') ||
                compact.startsWith('kazan') ||
                compact.startsWith('paket')
            ) {
                return { cat: 'PAKETLEME_FIKSE', table: 'paketleme_fikse_grup' };
            }

            if (
                searchVal.startsWith('klima') ||
                searchVal.startsWith('klm') ||
                searchVal.startsWith('kompres') ||
                searchVal.startsWith('kurut') ||
                searchVal.startsWith('pnom') ||
                searchVal.startsWith('pno') ||
                compact.startsWith('klima') ||
                compact.startsWith('kompres') ||
                compact.startsWith('kurut')
            ) {
                return { cat: 'KLIMA', table: 'klima_kompresor_grup' };
            }

            // İhzarat Model Kodları ve İsimleri (F5 dahil)
            if (
                searchVal.includes('fitil') ||
                compact.includes('fitil') ||
                compact.startsWith('ft6') ||
                compact.startsWith('marzol') ||
                compact.startsWith('f5') ||
                compact.startsWith('e32') ||
                compact.startsWith('e35') ||
                compact.startsWith('e26') ||
                compact.startsWith('a11') ||
                compact.startsWith('b12') ||
                compact.startsWith('b72') ||
                compact.startsWith('a79') ||
                compact.startsWith('a21') ||
                compact.startsWith('e80') ||
                compact.startsWith('c70') ||
                compact.startsWith('d45') ||
                compact.startsWith('cer') ||
                compact.startsWith('tarak') ||
                compact.startsWith('penye') ||
                compact.startsWith('servolab') ||
                compact.startsWith('omeg') ||
                compact.startsWith('unifloc') ||
                compact.startsWith('uniclean') ||
                compact.startsWith('unim') ||
                compact.startsWith('unistore') ||
                compact.startsWith('b25') ||
                compact.startsWith('kondenser')
            ) {
                return { cat: 'IHZARAT', table: 'machine_ihzarat' };
            }

            return null;
        }

        async function filterMachineList() {
            const rawVal = document.getElementById('search-input').value;
            const searchVal = normalize(rawVal);

            if (!searchVal) {
                renderMachines(allMachinesCache);
                return;
            }

            const target = resolveTargetCategoryForSearch(searchVal);
            if (target && canAccessMachineTable(target.table) && (activeTableName !== target.table || currentCategoryFilter !== target.cat)) {
                await setCategoryFilter(target.cat, target.table, true);
                return;
            }

            renderMachines(allMachinesCache);
        }

        function extractMachineNumber(opNo, combined, genName, mNo) {
            const directOp = parseInt(opNo, 10);
            if (!Number.isNaN(directOp) && String(directOp) === opNo.trim()) return directOp;
            const fullStr = `${combined} ${genName} ${mNo}`;
            const match = fullStr.match(/(?:ring|bobin|fitil|cer|tarak|penye|kompresor|kurutucu|f5|ft6d?)[-_\s]*(\d+)/i);
            if (match) return parseInt(match[1], 10);
            const anyNum = fullStr.match(/\b([1-9]\d?)\b/);
            return anyNum ? parseInt(anyNum[1], 10) : NaN;
        }

        function parseNumberedQuery(searchVal) {
            const m = searchVal.match(/^([a-z\u00c0-\u024f]+?)[\s\-_]*(\d+)$/i);
            if (!m) return null;
            return {
                prefix: normalize(m[1]),
                num: parseInt(m[2], 10),
                compact: compactKey(searchVal)
            };
        }

        function getMachineDisplayNumber(machine, allMachines) {
            const { opNo, combined } = getIhzaratNormalizedText(machine);
            const genName = normalize(getMachineGeneratedName(machine, allMachines));
            const mNo = normalize(String(machine.machine_no || ''));

            if (activeTableName === 'machine_ringbobin' || machine._sourceTable === 'machine_ringbobin') {
                const matchGen = genName.match(/(?:ring|bobin)[-_\s]*(\d+)/);
                if (matchGen) return parseInt(matchGen[1], 10);
                return Number(machine.id) <= 20 ? Number(machine.id) : Number(machine.id) - 20;
            }

            return extractMachineNumber(opNo, combined, genName, mNo);
        }

        function matchesCustomSearchRule(machine, searchVal, allMachines) {
            const { name, opNo, mNo, code, brand, model, combined } = getIhzaratNormalizedText(machine);
            const genName = normalize(getMachineGeneratedName(machine, allMachines));
            const compactHaystack = compactKey(`${name} ${opNo} ${mNo} ${code} ${brand} ${model} ${combined} ${genName}`);
            const fullHaystack = `${name} ${opNo} ${mNo} ${code} ${brand} ${model} ${combined} ${genName}`;
            const searchCompact = compactKey(searchVal);

            // K46 (Ring K46) özel kuralı
            if (searchCompact === 'k46' || searchCompact.startsWith('k46')) {
                const isBobinRow = fullHaystack.includes('bobin') || fullHaystack.includes('muratec') || fullHaystack.includes('qpro') || (!fullHaystack.includes('ring') && Number(machine.id) > 20);
                const isRingRow = !isBobinRow && (
                    fullHaystack.includes('ring') ||
                    fullHaystack.includes('k46') ||
                    genName.startsWith('ring') ||
                    machine._sourceTable === 'machine_ringbobin' ||
                    activeTableName === 'machine_ringbobin'
                );
                if (searchCompact === 'k46') return isRingRow;

                const numbered = parseNumberedQuery(searchVal);
                if (numbered) {
                    return isRingRow && getMachineDisplayNumber(machine, allMachines) === numbered.num;
                }
                return isRingRow;
            }

            // F5 (Marzoli F5 / Fitil 7) özel kuralı
            if (searchCompact === 'f5' || searchCompact.startsWith('f5')) {
                const isF5Fitil =
                    Number(machine.id) === 77 ||
                    opNo === '7' ||
                    mNo.includes('198/228') ||
                    combined.endsWith('-7') ||
                    genName.endsWith('-7') ||
                    fullHaystack.includes('f5') ||
                    fullHaystack.includes('fitil-7') ||
                    fullHaystack.includes('fitil7');
                const numbered = parseNumberedQuery(searchVal);
                if (numbered && numbered.num !== 7 && numbered.num !== 5) {
                    return false;
                }
                return isF5Fitil;
            }

            // Model Kodu / Makine Tipi Özel Eşleşme Sözlüğü
            const modelKeyMap = {
                'e32': ['servolab', 'e32'],
                'e26': ['servolab', 'e26'],
                'e35': ['omeg', 'e35'],
                'a11': ['unifloc', 'a11'],
                'b12': ['uniclean', 'b12'],
                'b72': ['unim', 'b72'],
                'a79': ['unistore', 'a79'],
                'a21': ['kondenser', 'a21'],
                'e80': ['penye', 'e80'],
                'c70': ['tarak', 'c70'],
                'd45': ['cer', 'd45'],
                'b25': ['telef', 'b25'],
            };

            for (const [modelKey, keywords] of Object.entries(modelKeyMap)) {
                if (searchCompact === modelKey || searchCompact.startsWith(modelKey)) {
                    return keywords.some(kw => compactHaystack.includes(kw));
                }
            }

            const numbered = parseNumberedQuery(searchVal);
            const machineNum = getMachineDisplayNumber(machine, allMachines);

            // Numaralı tekil arama (örn: RING-1, ring1, bobin-2, fitil-1, cer-3, tarak-1, penye-2)
            if (numbered) {
                const { prefix, num, compact } = numbered;

                if (compactHaystack.includes(compact) || genName === `${prefix}-${num}` || genName === `${prefix}${num}`) {
                    return true;
                }

                if (prefix === 'ring') {
                    const isRing = (fullHaystack.includes('ring') || genName.startsWith('ring') || (Number(machine.id) <= 20 && activeTableName === 'machine_ringbobin')) && !fullHaystack.includes('bobin');
                    return isRing && machineNum === num;
                }

                if (prefix === 'bobin' || prefix === 'qpro') {
                    const isBobin = (fullHaystack.includes('bobin') || genName.startsWith('bobin') || (Number(machine.id) > 20 && activeTableName === 'machine_ringbobin')) && !genName.startsWith('ring');
                    return isBobin && machineNum === num;
                }

                if (prefix === 'fitil' || prefix === 'ft6d' || prefix === 'ft6' || prefix === 'marzol') {
                    const isFitil = fullHaystack.includes('fitil') || fullHaystack.includes('ft6') || fullHaystack.includes('marzol');
                    return isFitil && machineNum === num;
                }

                if (prefix === 'cer' || prefix === 'd45') {
                    const isCer = fullHaystack.includes('cer') || fullHaystack.includes('d45');
                    return isCer && machineNum === num;
                }

                if (prefix === 'tarak' || prefix === 'c70') {
                    const isTarak = fullHaystack.includes('tarak') || fullHaystack.includes('c70');
                    return isTarak && machineNum === num;
                }

                if (prefix === 'penye' || prefix === 'e80') {
                    const isPenye = fullHaystack.includes('penye') || fullHaystack.includes('e80');
                    return isPenye && machineNum === num;
                }

                if (prefix === 'kompresor' || prefix === 'komp') {
                    return (fullHaystack.includes('kompres') || machine._sourceTable === 'machine_compressors') && machineNum === num;
                }

                if (prefix === 'kurutucu' || prefix === 'kur') {
                    return (fullHaystack.includes('kurut') || machine._sourceTable === 'machine_dryers') && machineNum === num;
                }

                return compactHaystack.includes(compact);
            }

            // ring -> Tüm Ring makineleri
            if (searchVal.startsWith('ring')) {
                const isBobin = fullHaystack.includes('bobin') || fullHaystack.includes('muratec') || fullHaystack.includes('qpro') || Number(machine.id) > 20;
                return (fullHaystack.includes('ring') || (Number(machine.id) <= 20 && activeTableName === 'machine_ringbobin')) && !isBobin;
            }

            // bobin veya qpro -> Tüm Bobin makineleri
            if (searchVal.startsWith('bobin') || searchVal.startsWith('qpro')) {
                const isRing = name.includes('ring') || genName.startsWith('ring');
                return (fullHaystack.includes('bobin') || fullHaystack.includes('qpro') || fullHaystack.includes('muratec') || (Number(machine.id) > 20 && activeTableName === 'machine_ringbobin')) && !isRing;
            }

            const isFitil = fullHaystack.includes('fitil') || fullHaystack.includes('ft6') || fullHaystack.includes('marzol') || mNo.includes('198/228');
            const num = extractMachineNumber(opNo, combined, genName, mNo);

            // fikse veya kazan -> fikse kazanı
            if (searchVal.startsWith('fikse') || searchVal.startsWith('kazan')) {
                return isFikseMachine(machine) || fullHaystack.includes('fikse') || fullHaystack.includes('kazan');
            }

            // paket -> paketleme makinesi
            if (searchVal.startsWith('paket') || searchVal.startsWith('pak')) {
                return isPaketMachine(machine) || fullHaystack.includes('paket');
            }

            // FT6D veya MARZOLI -> fitil-1 .. fitil-6
            if (searchVal === 'ft6d' || searchVal.startsWith('ft6') || searchVal.startsWith('marzol')) {
                if (!isFitil) return false;
                if (!Number.isNaN(num)) return num >= 1 && num <= 6;
                return true;
            }

            // Genel Esnek İçerme
            return fullHaystack.includes(searchVal) || compactHaystack.includes(searchCompact);
        }

        function getLocalDateTimeInputValue(date = new Date()) {
            const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
            return localDate.toISOString().slice(0, 16);
        }

        function getRecordDateTimeInputValue(recordDate) {
            if (!recordDate) return '';
            const value = String(recordDate);
            if (!/[T ]\d{2}:\d{2}/.test(value)) return `${value.slice(0, 10)}T00:00`;

            const date = new Date(value.replace(' ', 'T'));
            if (Number.isNaN(date.getTime())) return '';
            const localDate = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
            return localDate.toISOString().slice(0, 16);
        }

        function getTimestampWithLocalOffset(localDateTime) {
            if (!localDateTime) return '';
            const date = new Date(localDateTime);
            if (Number.isNaN(date.getTime())) return '';

            const offsetMinutes = -date.getTimezoneOffset();
            const offsetSign = offsetMinutes >= 0 ? '+' : '-';
            const absoluteOffset = Math.abs(offsetMinutes);
            const offsetHours = String(Math.floor(absoluteOffset / 60)).padStart(2, '0');
            const offsetRemainder = String(absoluteOffset % 60).padStart(2, '0');
            return `${localDateTime}:00${offsetSign}${offsetHours}:${offsetRemainder}`;
        }

                ? document.getElementById('rec-date').value
                : getLocalDateTimeInputValue();
            const recordDate = getTimestampWithLocalOffset(selectedDateTime);
            
            if(!desc) {
                alert('Lütfen bir açıklama girin!');
                return;
            }
            if (!recordDate) {
                alert('Lütfen geçerli bir tarih ve saat seçin!');
                return;
            }

            let mCode = getMachineGeneratedName(selectedMachine, allMachinesCache); 

            const fullDesc = `[IPL6-${mCode}] ${desc}`;
            const fullParts = parts ? `${mCode} | ${parts}` : '-';

            const { error } = await supabaseClient.from('maintenance_records').insert([{
                machine_id: selectedMachine.id > 9000 ? null : selectedMachine.id,
                record_type: type,
                description: fullDesc,
                parts_replaced: fullParts,
                technician: currentUser.name,
                record_date: recordDate
            }]);

            if(error) {
                alert('Kayıt eklenirken hata oluştu!');
                console.error(error);
                return;
            }

            closeAddRecordModal();
            document.getElementById('rec-desc').value = '';
            document.getElementById('rec-parts').value = '';
            loadRecordsForMachine();
        }

        async function hardResetApp() {
            if (confirm("Önbellek temizlenecek ve en güncel sürüm yüklenecek. Emin misiniz?")) {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for(let registration of registrations) {
                        await registration.unregister();
                    }
                }
                if ('caches' in window) {
                    const names = await caches.keys();
                    for (let name of names) {
                        await caches.delete(name);
                    }
                }
                localStorage.clear();
                alert("Önbellek başarıyla temizlendi! Sayfa yenileniyor...");
                window.location.reload(true);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
</body>
</html>
