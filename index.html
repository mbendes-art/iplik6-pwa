<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İplik 6 Bakım Takip PWA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0ea5e9">
    <style>
        html, body {
            overscroll-behavior-y: none;
            overscroll-behavior: none;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center shadow-md">
        <div>
            <h1 class="text-base font-bold text-sky-400">İplik-6 Bakım PWA</h1>
            <p id="role-badge" class="text-xs text-slate-400">Rol: -</p>
        </div>
        <div class="flex items-center gap-2">
            <button id="view-logs-btn" onclick="openLogsModal()" class="hidden bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs px-2.5 py-1 rounded font-medium">📋 Giriş Logları</button>
            <button onclick="hardResetApp()" class="bg-amber-600/20 text-amber-400 border border-amber-500/30 text-xs px-2.5 py-1 rounded font-medium">🧹 Önbellek</button>
            <span id="user-info" class="text-xs text-slate-300">Giriş Yapılmadı</span>
            <button id="logout-btn" onclick="handleLogout()" class="hidden bg-red-600/20 text-red-400 border border-red-500/30 text-xs px-2 py-1 rounded">Çıkış</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full">
        
        <!-- Login Section -->
        <div id="login-section" class="space-y-4 mt-4">
            <!-- GİRİŞ EKRANINDAKİ İŞLETME BİLDİRİM GİRİŞİ BUTONU -->
            <button onclick="openOperatorFaults()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition text-base border border-amber-400">
                <span>⚠️</span> <span>İŞLETME BİLDİRİM GİRİŞİ</span>
            </button>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-center text-sky-400">Teknisyen / Yönetici Girişi</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Kullanıcı Adı</label>
                        <input type="text" id="username-input" list="user-suggestions" oninput="filterUserSuggestions()" placeholder="örn: a_aslan, g_goktas" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-sky-500">
                        <datalist id="user-suggestions"></datalist>
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-semibold py-3 rounded-lg transition shadow">Giriş Yap</button>
                </div>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section" class="hidden space-y-4">
            <!-- İÇ EKRANDAKİ TÜM ARIZALAR BUTONU -->
            <button onclick="setCategoryFilter('TUM_ARIZALAR', 'tum_arizalar')" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition text-base border border-amber-400">
                <span>📋</span> <span>TÜM ARIZALARI GÖSTER</span>
            </button>

            <div class="flex justify-between items-center">
                <h2 id="section-title" class="text-lg font-semibold">Makine Listesi</h2>
                <button onclick="loadMachines()" class="bg-slate-800 border border-slate-700 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-lg text-sky-400">Yenile</button>
            </div>
            
            <!-- Arama Kutusu -->
            <input type="text" id="search-input" oninput="filterMachineList()" placeholder="Makine ara (örn: tarak, bobin, ring)..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">

            <!-- Hızlı Kategori Filtre Butonları -->
            <div id="category-pills" class="grid grid-cols-2 gap-2 text-xs">
                <button onclick="setCategoryFilter('RING_BOBIN', 'machine_ringbobin')" class="cat-btn bg-sky-600 text-white px-3 py-2 rounded-lg font-medium transition text-center">Ring/Bobin</button>
                <button onclick="setCategoryFilter('IHZARAT', 'machine_ihzarat')" class="cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center">İhzarat</button>
                <button onclick="setCategoryFilter('PAKETLEME', 'machines_paketleme')" class="cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center">Paketleme</button>
                <button onclick="setCategoryFilter('KLIMA', 'klima_kompresor_grup')" class="cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center">Klima/Kompresör</button>
            </div>

            <!-- TOPLU İŞLEM KONTROL ÇUBUĞU -->
            <div id="bulk-action-bar" class="hidden bg-sky-900/40 border border-sky-500/40 p-3 rounded-xl flex justify-between items-center shadow-lg">
                <span id="selected-count" class="text-xs text-sky-300 font-medium">0 makine seçildi</span>
                <button onclick="openBulkModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-lg font-semibold transition shadow">⚡ Toplu Kayıt Ekle</button>
            </div>

            <div id="machine-list" class="space-y-3 pb-6">
                <!-- Makineler buraya yüklenecek -->
            </div>
        </div>

        <!-- Machine Detail & Records Section -->
        <div id="detail-section" class="hidden space-y-4">
            <button onclick="backToDashboard()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition transform active:scale-95 text-base border border-sky-400">
                <span>⬅</span> <span>MAKİNE LİSTESİNE DÖN</span>
            </button>
            
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
                <h2 id="detail-machine-title" class="text-lg font-bold text-sky-400">Makine Adı</h2>
                <p id="detail-machine-info" class="text-xs text-slate-400 mt-1">Tür / Konum</p>
            </div>

            <button onclick="openAddRecordModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">➕ Yeni Bakım / Arıza Kaydı Ekle</button>

            <div class="flex justify-between items-center mt-2">
                <h3 class="text-sm font-semibold text-slate-300">Tüm Geçmiş Kayıtlar</h3>
            </div>

            <div id="records-list" class="space-y-3 pb-6">
                <!-- Kayıtlar buraya yüklenecek -->
            </div>
        </div>

    </main>

    <!-- Giriş Logları Modal -->
    <div id="logs-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h3 class="text-lg font-bold text-indigo-400">📋 Sistem Giriş Raporu</h3>
                <button onclick="closeLogsModal()" class="text-slate-400 hover:text-white text-sm font-bold px-2 py-1 bg-slate-700 rounded">✕</button>
            </div>
            <div id="logs-list-container" class="overflow-y-auto space-y-2 flex-1 pr-1">
                <p class="text-center text-slate-400 py-4">Loglar yükleniyor...</p>
            </div>
            <button onclick="closeLogsModal()" class="w-full bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm transition font-medium">Kapat</button>
        </div>
    </div>

    <!-- Kayıt Ekle Modal (Tekil) -->
    <div id="record-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-sky-400">Yeni Kayıt Ekle</h3>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Kayıt Türü</label>
                <select id="rec-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Periyodik Bakım">Periyodik Bakım</option>
                    <option value="Arıza Bildirimi" selected>Arıza Bildirimi</option>
                    <option value="Mekanik Müdahale">Mekanik Müdahale</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Açıklama</label>
                <textarea id="rec-desc" rows="3" placeholder="Yapılan işlemi veya arızayı yazın..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500"></textarea>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Değişen Parçalar / Not</label>
                <input type="text" id="rec-parts" placeholder="Örn: Rulman, Kayış (Yoksa boş bırakın)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeAddRecordModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm transition">İptal</button>
                <button onclick="submitNewRecord()" class="flex-1 bg-sky-600 hover:bg-sky-500 py-2.5 rounded-lg text-sm font-semibold transition">Kaydet</button>
            </div>
        </div>
    </div>

    <!-- Kayıt Düzenle Modal -->
    <div id="edit-record-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-amber-400">Kayıt Düzenle</h3>
            <input type="hidden" id="edit-rec-id">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Kayıt Türü</label>
                <select id="edit-rec-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Periyodik Bakım">Periyodik Bakım</option>
                    <option value="Arıza Bildirimi">Arıza Bildirimi</option>
                    <option value="Mekanik Müdahale">Mekanik Müdahale</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Açıklama</label>
                <textarea id="edit-rec-desc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Değişen Parçalar / Not</label>
                <input type="text" id="edit-rec-parts" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeEditRecordModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm transition">İptal</button>
                <button onclick="submitEditRecord()" class="flex-1 bg-amber-600 hover:bg-amber-500 py-2.5 rounded-lg text-sm font-semibold transition">Güncelle</button>
            </div>
        </div>
    </div>

    <!-- Toplu Kayıt Ekle Modal -->
    <div id="bulk-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md p-6 rounded-2xl space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold text-sky-400">⚡ Seçilen Makinelere Toplu Kayıt</h3>
            <p id="bulk-modal-info" class="text-xs text-slate-400"></p>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Kayıt Türü</label>
                <select id="bulk-rec-type" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
                    <option value="Periyodik Bakım">Periyodik Bakım</option>
                    <option value="Arıza Bildirimi" selected>Arıza Bildirimi</option>
                    <option value="Mekanik Müdahale">Mekanik Müdahale</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Ortak Açıklama</label>
                <textarea id="bulk-rec-desc" rows="3" placeholder="Tüm seçili makineler için ortak açıklamayı yazın..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500"></textarea>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Değişen Parçalar / Not</label>
                <input type="text" id="bulk-rec-parts" placeholder="Örn: Filtre değişti (Yoksa boş bırakın)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-sky-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeBulkModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2.5 rounded-lg text-sm transition">İptal</button>
                <button onclick="submitBulkRecords()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-lg text-sm font-semibold transition">Toplu Kaydet</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ahvsruxighjrbwbepqej.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFodnNydXhpZ2hqcmJ3YmVwcWVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1Nzk1NDQsImV4cCI6MjEwODE1NTU0NH0.WcUX2kYZGnWc-grbh5-BQTVBA0k4oGuQnVrpjh8E-sA';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const USERS = [
            { username: "mbendes", name: "M. Mendes (Yönetici)", role: "ALL_FACTORY" },
            { username: "cetinkaya", name: "Çetinkaya (Yönetici)", role: "ALL_FACTORY" },
            { username: "m_altuntas", name: "Mustafa Altuntaş", role: "KLIMA" },
            { username: "r_sahin", name: "R. Şahin", role: "ALL_FACTORY" },
            { username: "n_erturk", name: "N. Ertürk", role: "ALL_FACTORY" },
            { username: "g_albayrak", name: "G. Albayrak", role: "ALL_FACTORY" },
            { username: "g_goktas", name: "G. Göktaş", role: "IHZARAT" },
            { username: "a_gultekin", name: "A. Gültekin", role: "IHZARAT" },
            { username: "a_ozturk", name: "A. Öztürk", role: "IHZARAT" },
            { username: "f_duran", name: "F. Duran", role: "IHZARAT" },
            { username: "r_evler", name: "R. Evler", role: "IHZARAT" },
            { username: "g_gumus", name: "G. Gümüş", role: "IHZARAT" },
            { username: "a_aslan", name: "A. Aslan", role: "RING_BOBIN" },
            { username: "m_karahan", name: "M. Karahan", role: "RING_BOBIN" },
            { username: "m_bay", name: "M. Bay", role: "RING_BOBIN" },
            { username: "e_candan", name: "E. Candan", role: "RING_BOBIN" },
            { username: "l_yasar", name: "L. Yaşar", role: "RING_BOBIN" }
        ];

        let currentUser = null;
        let allMachinesCache = [];
        let selectedMachine = null;
        let currentCategoryFilter = 'RING_BOBIN';
        let activeTableName = 'machine_ringbobin';
        let selectedMachineIds = new Set();
        let currentRecordsCache = [];

        // 🛡️ KESİN GEÇMİŞ KİLİDİ
        history.replaceState({ page: 'app' }, document.title, window.location.href);
        window.addEventListener('popstate', function (event) {
            history.pushState({ page: 'app' }, document.title, window.location.href);
            if (currentUser) {
                const detailSec = document.getElementById('detail-section');
                const recordModal = document.getElementById('record-modal');
                const editModal = document.getElementById('edit-record-modal');
                const logsModal = document.getElementById('logs-modal');
                const bulkModal = document.getElementById('bulk-modal');

                if (!recordModal.classList.contains('hidden')) {
                    closeAddRecordModal();
                } else if (!editModal.classList.contains('hidden')) {
                    closeEditRecordModal();
                } else if (!logsModal.classList.contains('hidden')) {
                    closeLogsModal();
                } else if (!bulkModal.classList.contains('hidden')) {
                    closeBulkModal();
                } else if (!detailSec.classList.contains('hidden')) {
                    backToDashboard();
                }
            }
        });

        // 💾 Oturum Yönetimi
        window.addEventListener('DOMContentLoaded', () => {
            const savedUserJson = localStorage.getItem('iplik6_current_user');
            if (savedUserJson) {
                try {
                    currentUser = JSON.parse(savedUserJson);
                    document.getElementById('user-info').innerText = currentUser.name;
                    document.getElementById('role-badge').innerText = `Rol: ${currentUser.role}`;
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('dashboard-section').classList.remove('hidden');
                    document.getElementById('logout-btn').classList.remove('hidden');

                    if (currentUser.username === 'mbendes') {
                        document.getElementById('view-logs-btn').classList.remove('hidden');
                    }

                    setupCategoryPills();
                    loadMachines();
                } catch(e) {
                    localStorage.removeItem('iplik6_current_user');
                }
            }
        });

        function normalize(str) {
            return (str || "").trim().toLowerCase()
                .replace(/ı/g, 'i')
                .replace(/İ/g, 'i')
                .replace(/ğ/g, 'g')
                .replace(/ü/g, 'u')
                .replace(/ş/g, 's')
                .replace(/ö/g, 'o')
                .replace(/ç/g, 'c');
        }

        function filterUserSuggestions() {
            const rawVal = document.getElementById('username-input').value.trim();
            const datalistEl = document.getElementById('user-suggestions');
            datalistEl.innerHTML = '';

            if(!rawVal) return;

            const normVal = normalize(rawVal);
            const filteredUsers = USERS.filter(u => normalize(u.username).includes(normVal));

            filteredUsers.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.username;
                opt.innerText = `${u.name} (${u.username})`;
                datalistEl.appendChild(opt);
            });
        }

        async function handleLogin() {
            const rawInput = document.getElementById('username-input').value.trim();
            const normInput = normalize(rawInput);
            
            if(!normInput) {
                alert('Lütfen bir kullanıcı adı girin!');
                return;
            }

            const foundUser = USERS.find(u => normalize(u.username) === normInput);
            if(!foundUser) {
                alert('Hatalı veya tanımlı olmayan kullanıcı adı!');
                return;
            }

            currentUser = foundUser;
            localStorage.setItem('iplik6_current_user', JSON.stringify(currentUser));
            
            try {
                await supabaseClient.from('login_logs').insert([{ 
                    username: currentUser.username, 
                    login_time: new Date().toLocaleString('tr-TR') 
                }]);
            } catch(e) {}

            document.getElementById('user-info').innerText = currentUser.name;
            document.getElementById('role-badge').innerText = `Rol: ${currentUser.role}`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');

            if (currentUser.username === 'mbendes') {
                document.getElementById('view-logs-btn').classList.remove('hidden');
            } else {
                document.getElementById('view-logs-btn').classList.add('hidden');
            }

            setupCategoryPills();
            loadMachines();
        }

        // 📋 İŞLETME BİLDİRİM GİRİŞİ (SARI BUTON)
        async function openOperatorFaults() {
            currentUser = {
                username: "operator",
                name: "İşletme Operatörü",
                role: "OPERATOR"
            };
            localStorage.setItem('iplik6_current_user', JSON.stringify(currentUser));

            document.getElementById('user-info').innerText = currentUser.name;
            document.getElementById('role-badge').innerText = `Rol: Operatör`;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('logout-btn').classList.remove('hidden');

            setupCategoryPills();
            await setCategoryFilter('TUM_ARIZALAR', 'tum_arizalar');
        }

        function handleLogout() {
            if (confirm("Oturumu kapatmak istediğinize emin misiniz?")) {
                currentUser = null;
                selectedMachine = null;
                allMachinesCache = [];
                currentCategoryFilter = 'RING_BOBIN';
                activeTableName = 'machine_ringbobin';
                selectedMachineIds.clear();
                localStorage.removeItem('iplik6_current_user');
                
                document.getElementById('username-input').value = '';
                document.getElementById('user-suggestions').innerHTML = '';
                document.getElementById('detail-section').classList.add('hidden');
                document.getElementById('dashboard-section').classList.add('hidden');
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('logout-btn').classList.add('hidden');
                document.getElementById('view-logs-btn').classList.add('hidden');
                document.getElementById('user-info').innerText = 'Giriş Yapılmadı';
                document.getElementById('role-badge').innerText = 'Rol: -';
                document.getElementById('machine-list').innerHTML = '';
                document.getElementById('bulk-action-bar').classList.add('hidden');
            }
        }

        async function openLogsModal() {
            if (!currentUser || currentUser.username !== 'mbendes') return;

            const container = document.getElementById('logs-list-container');
            container.innerHTML = '<p class="text-center text-slate-400 py-4">Giriş logları yükleniyor...</p>';
            document.getElementById('logs-modal').classList.remove('hidden');

            const { data, error } = await supabaseClient
                .from('login_logs')
                .select('*')
                .order('id', { ascending: false })
                .limit(100);

            if (error) {
                container.innerHTML = '<p class="text-red-400 text-center">Loglar yüklenirken hata oluştu.</p>';
                return;
            }

            let logs = data || [];
            container.innerHTML = '';

            if (logs.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 py-4">Henüz giriş kaydı bulunmuyor.</p>';
                return;
            }

        async function setCategoryFilter(cat, tableName) {
            currentCategoryFilter = cat;

            document.getElementById('bulk-action-bar').classList.add('hidden');
            
            document.querySelectorAll('#category-pills button').forEach(btn => {
                const btnText = btn.innerText.trim();
                if(normalize(btnText).includes(normalize(cat)) || 
                   (cat === 'RING_BOBIN' && btnText.includes('Ring')) || 
                   (cat === 'IHZARAT' && btnText.includes('İhzarat')) ||
                   (cat === 'PAKETLEME' && btnText.includes('Paketleme')) ||
                   (cat === 'KLIMA' && btnText.includes('Klima'))) {
                    btn.className = btn.classList.contains('col-span-2') 
                        ? "cat-btn bg-sky-600 text-white px-3 py-2 rounded-lg font-medium transition text-center col-span-2"
                        : "cat-btn bg-sky-600 text-white px-3 py-2 rounded-lg font-medium transition text-center";
                } else {
                    btn.className = btn.classList.contains('col-span-2')
                        ? "cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center col-span-2"
                        : "cat-btn bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 px-3 py-2 rounded-lg font-medium transition text-center";

            });

        }

        async function loadMachines() {
            const listEl = document.getElementById('machine-list');
            listEl.innerHTML = '<p class="text-center text-slate-400 py-4">Yükleniyor...</p>';

            if (activeTableName === 'tum_arizalar') {
                document.getElementById('bulk-action-bar').classList.add('hidden');
                const { data, error } = await supabaseClient
                    .from('maintenance_records')
                    .select('*')
                    .order('record_date', { ascending: false })
                    .limit(500);

                if (error) {
                    listEl.innerHTML = '<p class="text-red-400 text-center">Arızalar yüklenirken hata oluştu.</p>';
                    return;
                }

                let records = data || [];
                currentRecordsCache = records;

                listEl.innerHTML = '';
                if (records.length === 0) {
                    listEl.innerHTML = '<p class="text-center text-slate-500 py-4">Kayıtlı arıza bulunamadı.</p>';
                    return;
                }

                const isMbendes = currentUser && currentUser.username === 'mbendes';
                const isOperator = currentUser && currentUser.role === 'OPERATOR';

                records.forEach(rec => {
                    const canEdit = !isOperator;
                    const canDelete = isMbendes;

                    const isMyRecord = currentUser && rec.technician === currentUser.name;
                    const cardBgClass = isMyRecord ? 'bg-amber-950/40 border-amber-500/60' : 'bg-slate-800 border-slate-700';

                    let actionBtnsHtml = '';
                    if (canEdit || canDelete) {
                        actionBtnsHtml += `<div class="flex items-center gap-1.5">`;
                        if (canEdit) {
                            actionBtnsHtml += `<button onclick="openEditRecordModal(${rec.id})" class="text-amber-400 hover:text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 px-2 py-0.5 rounded text-xs transition">Düzenle</button>`;
                        }
                        if (canDelete) {
                            actionBtnsHtml += `<button onclick="deleteRecord(${rec.id})" class="text-red-400 hover:text-red-300 bg-red-500/10 hover:bg-red-500/20 px-2 py-0.5 rounded text-xs transition">Sil</button>`;
                        }
                        actionBtnsHtml += `</div>`;
                    }

                    listEl.innerHTML += `
                        <div class="${cardBgClass} p-4 rounded-xl border space-y-1 shadow relative">
                            <div class="flex justify-between items-center text-xs">
                                <span class="${isMyRecord ? 'text-amber-300 font-bold' : 'text-amber-400 font-semibold'}">${rec.record_type || 'Arıza/Bakım'} ${isMyRecord ? '⭐ (Sizin Kaydınız)' : ''}</span>
                                <div class="flex items-center gap-2">
                                    <span class="text-slate-400">${rec.record_date || ''}</span>
                                    ${actionBtnsHtml}
                                </div>
                            </div>
                            <p class="text-sm text-slate-200 mt-1 cursor-pointer" onclick="openMachineFromRecord('${escapeHtml(rec.description)}')">${rec.description}</p>
                            <p class="text-xs text-slate-400 border-t border-slate-700/50 pt-1 mt-1">Parça: ${rec.parts_replaced || '-'} | Bildiren/Teknisyen: ${rec.technician || '-'}</p>
                        </div>
                    `;
                });
                return;
            }

            if (activeTableName === 'klima_kompresor_grup') {
                const [compRes, dryRes, mainRes] = await Promise.all([
                    supabaseClient.from('machine_compressors').select('*'),
                    supabaseClient.from('machine_dryers').select('*'),
                    supabaseClient.from('machines').select('*')
                ]);

                let comps = compRes.data || [];
                let dries = dryRes.data || [];
                let mains = mainRes.data || [];

                comps.forEach(c => { c._sourceTable = 'machine_compressors'; c._brand = 'Atlas Copco'; });
                dries.forEach(d => { d._sourceTable = 'machine_dryers'; d._brand = 'Atlas Copco'; });

                let klimasAndPnms = mains.filter(m => {
                    const txt = normalize(`${m.machine_name || m.name || ''} ${m.machine_no || m.code || ''} ${m.location || ''}`);
                    return txt.includes('klm') || txt.includes('klima') || txt.includes('pnm') || txt.includes('pnömofil') || txt.includes('pnomofil');
                });
                klimasAndPnms.forEach(k => { k._sourceTable = 'machines'; k._brand = 'TEMSAN'; });

                allMachinesCache = [...comps, ...dries, ...klimasAndPnms];
            } else {
                const targetTable = activeTableName || 'machine_ringbobin';
                const { data, error } = await supabaseClient.from(targetTable).select('*').range(0, 999).order('id', { ascending: true });
                
                if (error) {
                    if (targetTable === 'machines_paketleme') {
                        const { data: mainData } = await supabaseClient.from('machines').select('*');
                        allMachinesCache = (mainData || []).filter(m => {
                            const c = normalize(m.code || '');
                            const n = normalize(m.name || m.machine_name || '');
                            return c.includes('paket') || n.includes('paket') || c.includes('pak') || n.includes('pak');
                        });
                    } else {
                        listEl.innerHTML = '<p class="text-red-400 text-center">Makineler yüklenirken hata oluştu.</p>';
                        return;
                    }
                } else {
                    allMachinesCache = data || [];
                }

                allMachinesCache.forEach(m => {
                    m._sourceTable = targetTable;
                    m._brand = m.brand || 'Rieter';
                });
            }

            renderMachines(allMachinesCache);
        }

        function sortMachinesCustom(a, b) {
            return a.id - b.id;
        }

        function renderMachines(machines) {
            const listEl = document.getElementById('machine-list');
            const searchVal = normalize(document.getElementById('search-input').value);

            let allowed = machines;

            if (searchVal) {
                allowed = allowed.filter(m => {
                    const name = m.machine_name || m.name || m.code || '';
                    const code = m.machine_no || m.serial_no || '';
                    return normalize(name).includes(searchVal) || normalize(code).includes(searchVal);
                });
            } else if (activeTableName === 'machine_ringbobin') {
                allowed.sort(sortMachinesCustom);
            }

            listEl.innerHTML = '';
            if(allowed.length === 0) {
                listEl.innerHTML = '<p class="text-center text-slate-500 py-4">Gösterilecek makine bulunamadı.</p>';
                return;
            }

            let compCounter = 0;
            let dryCounter = 0;

            allowed.forEach((machine, index) => {
                let displayName = '';
                let displayCode = '';
                let displayLoc = machine.location || machine.operation_no || 'İplik-6';
                let displayBrand = machine._brand || machine.brand || 'Rieter';

                if (activeTableName === 'machine_ringbobin') {
                    displayName = (machine.machine_name || '').trim();
                    if (!displayName) {
                        displayName = machine.id <= 20 ? `RING-${machine.id}` : `BOBİN-${machine.id - 20}`;
                    }
                    displayBrand = machine.id <= 20 ? 'RIETER' : 'MURATEC';
                    displayCode = machine.machine_no ? `Makine No: ${machine.machine_no}` : (machine.serial_no ? `Seri No: ${machine.serial_no}` : '');
                } else if (activeTableName === 'machine_ihzarat') {
                    let rawName = machine.machine_name || machine.name || 'Makine';
                    let rawNo = machine.operation_no || machine.machine_no || machine.code || '';
                    displayName = rawNo ? `${rawName}-${rawNo}` : rawName;
                    displayCode = machine.machine_no ? `Makine No: ${machine.machine_no}` : '';
                } else if (machine._sourceTable === 'machine_compressors' || machine._sourceTable === 'machine_dryers') {
                    let comps = allowed.filter(m => m._sourceTable === 'machine_compressors');
                    let dries = allowed.filter(m => m._sourceTable === 'machine_dryers');

                    if (machine._sourceTable === 'machine_compressors') {
                        compCounter++;
                        displayName = `KOMPRESÖR-${compCounter}`;
                    } else {
                        dryCounter++;
                        displayName = `KURUTUCU-${dryCounter}`;
                    }
                    displayCode = machine.serial_no ? `Seri No: ${machine.serial_no}` : (machine.code || '');
                } else {
                    displayName = machine.code || machine.name || machine.machine_name || 'Makine';
                    displayCode = machine.serial_no || '';
                }

                const subInfo = displayCode ? `${displayCode} | Marka: ${displayBrand}` : `Marka: ${displayBrand}`;
                const isChecked = selectedMachineIds.has(machine.id) ? 'checked' : '';

                listEl.innerHTML += `
                    <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex items-center justify-between shadow">
                        <div class="flex items-center gap-3 flex-1 cursor-pointer pr-2" onclick="openMachineDetail(${machine.id})">
                            <div>
                                <h3 class="font-bold text-sky-400 text-sm">${displayName}</h3>
                                <p class="text-xs text-slate-400">Konum: ${displayLoc} | ${subInfo}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 pl-3 border-l border-slate-700/60">
                            <input type="checkbox" data-id="${machine.id}" ${isChecked} onchange="toggleMachineSelection(${machine.id}, this)" class="w-6 h-6 accent-sky-600 rounded cursor-pointer">
                            <button onclick="openMachineDetail(${machine.id})" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded-lg text-slate-300 font-medium">Seç →</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleMachineSelection(machineId, checkbox) {
            if (checkbox.checked) {
                selectedMachineIds.add(machineId);
            } else {
                selectedMachineIds.delete(machineId);
            }

            const bar = document.getElementById('bulk-action-bar');
            const countText = document.getElementById('selected-count');
            
            if (selectedMachineIds.size > 0) {
                bar.classList.remove('hidden');
                countText.innerText = `${selectedMachineIds.size} makine seçildi`;
            } else {
                bar.classList.add('hidden');
            }
        }

        function openBulkModal() {
            if (selectedMachineIds.size === 0) {
                alert('Lütfen en az bir makine seçin!');
                return;
            }
            document.getElementById('bulk-modal-info').innerText = `${selectedMachineIds.size} adet makineye ortak kayıt eklenecek.`;
            document.getElementById('bulk-modal').classList.remove('hidden');
        }

        function closeBulkModal() {
            document.getElementById('bulk-modal').classList.add('hidden');

        async function submitBulkRecords() {
            const type = document.getElementById('bulk-rec-type').value;
            const desc = document.getElementById('bulk-rec-desc').value.trim();
            const parts = document.getElementById('bulk-rec-parts').value.trim();

            if (!desc) {
                alert('Lütfen bir açıklama girin!');
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            let successCount = 0;

            for (let mId of selectedMachineIds) {
                let machine = allMachinesCache.find(m => m.id === mId);
                if (!machine) continue;

                let mCode = getMachineGeneratedName(machine, allMachinesCache);
                const fullDesc = `[IPL6-${mCode}] ${desc}`;
                const fullParts = parts ? `IPL6-${mCode} | ${parts}` : '-';

                const { error } = await supabaseClient.from('maintenance_records').insert([{
                    machine_id: machine.id > 9000 ? null : machine.id,
                    record_type: type,
                    description: fullDesc,
                    parts_replaced: fullParts,
                    technician: currentUser.name,
                    record_date: todayStr
                }]);

                if (!error) successCount++;
            }

            alert(`${successCount} makineye kayıt başarıyla eklendi!`);
            closeBulkModal();
            document.getElementById('bulk-rec-desc').value = '';
            document.getElementById('bulk-rec-parts').value = '';
            selectedMachineIds.clear();
            document.getElementById('bulk-action-bar').classList.add('hidden');
            loadMachines();
        }

        function filterMachineList() {
            renderMachines(allMachinesCache);
        }

        function getMachineGeneratedName(machine, allList) {
            if (activeTableName === 'machine_ringbobin') {
                let nameVal = (machine.machine_name || '').trim();
                if (nameVal) return nameVal;
                return machine.id <= 20 ? `RING-${machine.id}` : `BOBİN-${machine.id - 20}`;
            } else if (activeTableName === 'machine_ihzarat') {
                let rawName = machine.machine_name || machine.name || '';
                let rawNo = machine.operation_no || machine.machine_no || machine.code || '';
                return rawNo ? `${rawName}-${rawNo}` : rawName;
            } else if (machine._sourceTable === 'machine_compressors' || machine._sourceTable === 'machine_dryers') {
                let comps = allList.filter(m => m._sourceTable === 'machine_compressors');
                let dries = allList.filter(m => m._sourceTable === 'machine_dryers');
                if (machine._sourceTable === 'machine_compressors') {
                    let pos = comps.indexOf(machine) + 1;
                    return `KOMPRESÖR-${pos}`;
                } else {
                    let pos = dries.indexOf(machine) + 1;
                    return `KURUTUCU-${pos}`;
                }
            } else {
                return machine.code || machine.name || machine.machine_name || '';
            }
        }

            if(!selectedMachine) return;

            document.getElementById('dashboard-section').classList.add('hidden');
            document.getElementById('detail-section').classList.remove('hidden');

            let titleStr = getMachineGeneratedName(selectedMachine, allMachinesCache);

            document.getElementById('detail-machine-title').innerText = titleStr;
            document.getElementById('detail-machine-info').innerText = `Konum: ${selectedMachine.location || selectedMachine.operation_no || 'İplik-6'}`;

            loadRecordsForMachine();
        }

            selectedMachine = null;
            document.getElementById('detail-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

            const recListEl = document.getElementById('records-list');

                .from('maintenance_records')
                .select('*')
                .order('record_date', { ascending: false })
                .limit(500);

            if(error) {
                recListEl.innerHTML = '<p class="text-red-400 text-center">Kayıtlar yüklenirken hata oluştu.</p>';
                return;
            }

            let records = data || [];
            currentRecordsCache = records;
            recListEl.innerHTML = '';
            
            let filteredRecords = records.filter(rec => {
                const descNorm = normalize(rec.description || '');
                const matchTag = descNorm.match(/\[(.*?)\]/);
                if (matchTag) {
                    let tagContent = normalize(matchTag[1]).replace(/[-\s]/g, '');
                    let target1 = normalize(mCode).replace(/[-\s]/g, '');
                    let target2 = normalize("ipl6" + mCode).replace(/[-\s]/g, '');

                    return tagContent === target1 || tagContent === target2;
                }

                return false;
            });

                recListEl.innerHTML = '<p class="text-center text-slate-500 py-4">Bu makineye ait geçmiş kayıt bulunamadı.</p>';

            filteredRecords.forEach(rec => {
                const canEdit = !isOperator;
                const canDelete = isMbendes;

                const isMyRecord = currentUser && rec.technician === currentUser.name;
                const cardBgClass = isMyRecord ? 'bg-amber-950/40 border-amber-500/60' : 'bg-slate-800 border-slate-700';

                let actionBtnsHtml = '';
                if (canEdit || canDelete) {
                    actionBtnsHtml += `<div class="flex items-center gap-1.5">`;
                    if (canEdit) {
                        actionBtnsHtml += `<button onclick="openEditRecordModal(${rec.id})" class="text-amber-400 hover:text-amber-300 bg-amber-500/10 hover:bg-amber-500/20 px-2 py-0.5 rounded text-xs transition">Düzenle</button>`;
                    }
                    if (canDelete) {
                        actionBtnsHtml += `<button onclick="deleteRecord(${rec.id})" class="text-red-400 hover:text-red-300 bg-red-500/10 bg-red-500/20 px-2 py-0.5 rounded text-xs transition">Sil</button>`;
                    }
                    actionBtnsHtml += `</div>`;
                }

                recListEl.innerHTML += `
                    <div class="${cardBgClass} p-4 rounded-xl border space-y-1 shadow relative">
                        <div class="flex justify-between items-center text-xs">
                            <span class="${isMyRecord ? 'text-amber-300 font-bold' : 'text-sky-400 font-semibold'}">${rec.record_type || 'Bakım'} ${isMyRecord ? '⭐ (Sizin Kaydınız)' : ''}</span>
                            <div class="flex items-center gap-2">
                                <span class="text-slate-400">${rec.record_date || ''}</span>
                                ${actionBtnsHtml}
                            </div>
                        </div>
                        <p class="text-sm text-slate-200 mt-1">${rec.description}</p>
                        <p class="text-xs text-slate-400 border-t border-slate-700/50 pt-1 mt-1">Parça: ${rec.parts_replaced || '-'} | Bildiren/Teknisyen: ${rec.technician || '-'}</p>
                    </div>
                `;
            });
        }

        function openEditRecordModal(recordId) {
            const rec = currentRecordsCache.find(r => r.id === recordId);
            if (!rec) return;

            document.getElementById('edit-rec-id').value = rec.id;
            document.getElementById('edit-rec-type').value = rec.record_type || 'Periyodik Bakım';
            document.getElementById('edit-rec-desc').value = rec.description || '';
            document.getElementById('edit-rec-parts').value = rec.parts_replaced || '';

            document.getElementById('edit-record-modal').classList.remove('hidden');
        }

        function closeEditRecordModal() {
            document.getElementById('edit-record-modal').classList.add('hidden');
        }

        async function submitEditRecord() {
            const rId = document.getElementById('edit-rec-id').value;
            const type = document.getElementById('edit-rec-type').value;
            const desc = document.getElementById('edit-rec-desc').value.trim();
            const parts = document.getElementById('edit-rec-parts').value.trim();

            if (!desc) {
                alert('Lütfen bir açıklama girin!');
                return;
            }

            const { error } = await supabaseClient
                .from('maintenance_records')
                .update({
                    record_type: type,
                    description: desc,
                    parts_replaced: parts || '-'
                })
                .eq('id', rId);

            if (error) {
                alert('Kayıt güncellenirken bir hata oluştu!');
                console.error(error);
                return;
            }

            alert('Kayıt başarıyla güncellendi!');
            closeEditRecordModal();

            if (activeTableName === 'tum_arizalar') {
                loadMachines();
            } else {
                loadRecordsForMachine();
            }
        }

        async function deleteRecord(recordId) {
            const isMbendes = currentUser && currentUser.username === 'mbendes';

            if (!isMbendes) {
                alert("Bu kaydı silme yetkiniz yok!");
                return;
            }

            if (confirm("Bu kayıt kalıcı olarak silinecek. Emin misiniz?")) {
                const { error } = await supabaseClient
                    .from('maintenance_records')
                    .delete()
                    .eq('id', recordId);

                if (error) {
                    alert("Kayıt silinirken bir hata oluştu!");
                    console.error(error);
                    return;
                }

                alert("Kayıt başarıyla silindi.");
                
                if (activeTableName === 'tum_arizalar') {
                    loadMachines();
                } else {
                    loadRecordsForMachine();
                }
            }
        }

        function escapeHtml(text) {
            return (text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        async function openMachineFromRecord(desc) {
            const match = desc.match(/\[(.*?)\]/);
            if (!match) {
                alert('Bu kayıtta makine etiketi bulunamadı.');
                return;
            }
            const tag = match[1].trim();

            const [ringRes, ihzaratRes, compRes, dryRes] = await Promise.all([
                supabaseClient.from('machine_ringbobin').select('*'),
                supabaseClient.from('machine_ihzarat').select('*'),
                supabaseClient.from('machine_compressors').select('*'),
                supabaseClient.from('machine_dryers').select('*')
            ]);

            let factoryMachines = [
                ...(ringRes.data || []).map(m => { m._sourceTable = 'machine_ringbobin'; return m; }),
                ...(ihzaratRes.data || []).map(m => { m._sourceTable = 'machine_ihzarat'; return m; }),
                ...(compRes.data || []).map(m => { m._sourceTable = 'machine_compressors'; return m; }),
                ...(dryRes.data || []).map(m => { m._sourceTable = 'machine_dryers'; return m; })
            ];

            allMachinesCache = factoryMachines;
            activeTableName = 'machine_ringbobin';

            let found = null;
            for (let m of factoryMachines) {
                let genName = getMachineGeneratedNameForSearch(m, factoryMachines);
                if (normalize(genName) === normalize(tag) || normalize(m.code || '') === normalize(tag)) {
                    found = m;
                    break;
                }
            }

            if (found) {
                activeTableName = found._sourceTable || 'machine_ringbobin';
                openMachineDetail(found.id);
            } else {
                alert(`"${tag}" makinesi sistemde eşleştirilemedi.`);
            }
        }

        function getMachineGeneratedNameForSearch(machine, allList) {
            let code = normalize(machine.code || machine.name || machine.machine_name || '');
            if (code.includes('ring') || code.includes('bobin') || activeTableName === 'machine_ringbobin') {
                let nameVal = (machine.machine_name || '').trim();
                if (nameVal) return nameVal;
                return machine.id <= 20 ? `RING-${machine.id}` : `BOBİN-${machine.id - 20}`;
            }
            if (activeTableName === 'machine_ihzarat') {
                let rName = machine.machine_name || machine.name || '';
                let rNo = machine.operation_no || machine.machine_no || machine.code || '';
                return rNo ? `${rName}-${rNo}` : rName;
            }
            if (machine._sourceTable === 'machine_compressors' || machine._sourceTable === 'machine_dryers') {
                let comps = allList.filter(m => m._sourceTable === 'machine_compressors');
                let dries = allList.filter(m => m._sourceTable === 'machine_dryers');
                if (machine._sourceTable === 'machine_compressors') {
                    let pos = comps.indexOf(machine) + 1;
                    return `KOMPRESÖR-${pos}`;
                } else {
                    let pos = dries.indexOf(machine) + 1;
                    return `KURUTUCU-${pos}`;
                }
            }
            return machine.code || machine.name || machine.machine_name || '';
        }

        openAddRecordModal = function() {
            document.getElementById('record-modal').classList.remove('hidden');
        }

        function closeAddRecordModal() {
            document.getElementById('record-modal').classList.add('hidden');
        }

        function openBulkModal() {
            if (selectedMachineIds.size === 0) {
                alert('Lütfen en az bir makine seçin!');
                return;
            }
            document.getElementById('bulk-modal-info').innerText = `${selectedMachineIds.size} adet makineye ortak kayıt eklenecek.`;
            document.getElementById('bulk-modal').classList.remove('hidden');
        }

        function closeBulkModal() {
            document.getElementById('bulk-modal').classList.add('hidden');
        }

        async function submitBulkRecords() {
            const type = document.getElementById('bulk-rec-type').value;
            const desc = document.getElementById('bulk-rec-desc').value.trim();
            const parts = document.getElementById('bulk-rec-parts').value.trim();

            if (!desc) {
                alert('Lütfen bir açıklama girin!');
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];
            let successCount = 0;

            for (let mId of selectedMachineIds) {
                let machine = allMachinesCache.find(m => m.id === mId);
                if (!machine) continue;

                let mCode = getMachineGeneratedName(machine, allMachinesCache);
                const fullDesc = `[IPL6-${mCode}] ${desc}`;
                const fullParts = parts ? `IPL6-${mCode} | ${parts}` : '-';

                const { error } = await supabaseClient.from('maintenance_records').insert([{
                    machine_id: machine.id > 9000 ? null : machine.id,
                    record_type: type,
                    description: fullDesc,
                    parts_replaced: fullParts,
                    technician: currentUser.name,
                    record_date: todayStr
                }]);

                if (!error) successCount++;
            }

            alert(`${successCount} makineye kayıt başarıyla eklendi!`);
            closeBulkModal();
            document.getElementById('bulk-rec-desc').value = '';
            document.getElementById('bulk-rec-parts').value = '';
            selectedMachineIds.clear();
            document.getElementById('bulk-action-bar').classList.add('hidden');
            loadMachines();
        }

        async function submitNewRecord() {
            const type = document.getElementById('rec-type').value;
            const desc = document.getElementById('rec-desc').value.trim();
            const parts = document.getElementById('rec-parts').value.trim();
            
            if(!desc) {
                alert('Lütfen bir açıklama girin!');
                return;
            }

            let mCode = getMachineGeneratedName(selectedMachine, allMachinesCache); 

            const fullDesc = `[IPL6-${mCode}] ${desc}`;
            const fullParts = parts ? `[IPL6-${mCode}] ${parts}` : '-';
            const todayStr = new Date().toISOString().split('T')[0];

            const { error } = await supabaseClient.from('maintenance_records').insert([{
                machine_id: selectedMachine.id > 9000 ? null : selectedMachine.id,
                record_type: type,
                description: fullDesc,
                parts_replaced: fullParts,
                technician: currentUser.name,
                record_date: todayStr
            }]);

            if(error) {
                alert('Kayıt eklenirken hata oluştu!');
                console.error(error);
                return;
            }

            closeAddRecordModal();
            document.getElementById('rec-desc').value = '';
            document.getElementById('rec-parts').value = '';
            loadRecordsForMachine();
        }

        async function hardResetApp() {
            if (confirm("Önbellek temizlenecek ve en güncel sürüm yüklenecek. Emin misiniz?")) {
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for(let registration of registrations) {
                        await registration.unregister();
                    }
                }
                if ('caches' in window) {
                    const names = await caches.keys();
                    for (let name of names) {
                        await caches.delete(name);
                    }
                }
                localStorage.clear();
                alert("Önbellek başarıyla temizlendi! Sayfa yenileniyor...");
                window.location.reload(true);
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                for(let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
